<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fetchlane cover</title>
<style>
  html, body { margin: 0; background: var(--surface-100); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--surface-100); font-family: var(--font-display); }
  .cv svg { position: absolute; left: 0; top: 0; }
  .tint { fill: var(--surface-selected); }
  .track { fill: var(--progress-track); }
  .teal { fill: var(--accent); }
  .amber { fill: var(--status-retry); }
  .dash { fill: var(--accent-text); }
  .r-lg { rx: var(--radius-lg); }
  .r-xs { rx: var(--radius-xs); }
  .name { position: absolute; left: 40px; bottom: 64px; margin: 0; font-size: 80px; line-height: 76px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .tag { position: absolute; left: 42px; bottom: 36px; margin: 0; font-family: var(--font-ui); font-size: 14px; line-height: 20px; color: var(--ink-muted); }
</style></head>
<body>
<div class="cv">
  <!--
    blocks: accent (96×220 slab, 80×104 file), surface-selected tint (96×300 lanes ×2), progress-track (96×300 lane), status-retry (80×32, small signal)
    arrangement: four vertical lanes from x=520, 96 wide on a 24 (space-6) gutter, slabs bleeding off top and right — downloads standing in line
    pattern: literal motif "lane" from the mark — dashed lane dividers, 4×16 pills (radius-xs) at a 28 px pitch; chosen because the brand's one idea is files moving down ordered lanes
    scales: widths 96 = 4×space-6, gutters space-6, pill gap space-3, corners radius-lg (blocks) and radius-xs (pills)
  -->
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <rect class="tint r-lg" x="520" y="-8" width="96" height="316"/>
    <rect class="teal r-lg" x="528" y="148" width="80" height="104"/>
    <rect class="track r-lg" x="640" y="-8" width="96" height="316"/>
    <rect class="amber r-lg" x="648" y="56" width="80" height="32"/>
    <rect class="teal r-lg" x="760" y="-8" width="96" height="228"/>
    <rect class="tint r-lg" x="880" y="-8" width="96" height="316"/>
    <g class="dash">
      <rect class="r-xs" x="626" y="12" width="4" height="16"/><rect class="r-xs" x="626" y="40" width="4" height="16"/><rect class="r-xs" x="626" y="68" width="4" height="16"/><rect class="r-xs" x="626" y="96" width="4" height="16"/><rect class="r-xs" x="626" y="124" width="4" height="16"/><rect class="r-xs" x="626" y="152" width="4" height="16"/><rect class="r-xs" x="626" y="180" width="4" height="16"/><rect class="r-xs" x="626" y="208" width="4" height="16"/><rect class="r-xs" x="626" y="236" width="4" height="16"/><rect class="r-xs" x="626" y="264" width="4" height="16"/>
      <rect class="r-xs" x="746" y="12" width="4" height="16"/><rect class="r-xs" x="746" y="40" width="4" height="16"/><rect class="r-xs" x="746" y="68" width="4" height="16"/><rect class="r-xs" x="746" y="96" width="4" height="16"/><rect class="r-xs" x="746" y="124" width="4" height="16"/><rect class="r-xs" x="746" y="152" width="4" height="16"/><rect class="r-xs" x="746" y="180" width="4" height="16"/><rect class="r-xs" x="746" y="208" width="4" height="16"/><rect class="r-xs" x="746" y="236" width="4" height="16"/><rect class="r-xs" x="746" y="264" width="4" height="16"/>
      <rect class="r-xs" x="866" y="12" width="4" height="16"/><rect class="r-xs" x="866" y="40" width="4" height="16"/><rect class="r-xs" x="866" y="68" width="4" height="16"/><rect class="r-xs" x="866" y="96" width="4" height="16"/><rect class="r-xs" x="866" y="124" width="4" height="16"/><rect class="r-xs" x="866" y="152" width="4" height="16"/><rect class="r-xs" x="866" y="180" width="4" height="16"/><rect class="r-xs" x="866" y="208" width="4" height="16"/><rect class="r-xs" x="866" y="236" width="4" height="16"/><rect class="r-xs" x="866" y="264" width="4" height="16"/>
    </g>
  </svg>
  <h1 class="name">Fetchlane</h1>
  <p class="tag">Your downloads, in order.</p>
</div>
</body>
</html>
